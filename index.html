<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: whitesmoke;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .display {
            color: #F92672;
            font-size: 100px;
        }
        .buttons{
            background-color: #F92672; 
            border: 1px solid #F92672;
            border-radius: 7px;
            color: white;
            font-size: 30px;
            height: 50px;
            padding: 0px 10px;
        }
        .btn-div{
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        @media (max-width: 600px) {
            .display {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>
    <div>
        <div class="display">
            <span id="hour">00</span> : <span id="minute">00</span> :<span id="second">00</span>
        </div>
        <div class="btn-div">
            <button id="startBtn" class="buttons">Start</button>
            <button id="stopBtn" class="buttons">Stop</button>
            <button id="resetBtn" class="buttons">Reset</button>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
